services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: comply, POSTGRES_PASSWORD: comply, POSTGRES_DB: comply }
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://comply:comply@db:5432/comply
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-32+-chars}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
